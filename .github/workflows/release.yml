name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Installer and Executables
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Self-Contained Single-File Executable
        run: |
          dotnet publish InternetSpeedMeter.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./publish

      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix

      - name: Build MSI Installer
        run: |
          mkdir dist
          wix build installer.wxs -o ./dist/InternetSpeedMeter-Setup.msi

      - name: Package Release Assets
        shell: pwsh
        run: |
          Copy-Item ./publish/InternetSpeedMeter.exe ./dist/InternetSpeedMeter.exe
          Compress-Archive -Path ./publish/InternetSpeedMeter.exe -DestinationPath ./dist/InternetSpeedMeter-Portable.zip

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != '' && startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: "Internet Speed Meter ${{ github.ref_name != '' && startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/InternetSpeedMeter-Setup.msi
            dist/InternetSpeedMeter.exe
            dist/InternetSpeedMeter-Portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
